# Render Blueprint — deploy with "New > Blueprint" at https://dashboard.render.com
# Docs: https://docs.render.com/blueprint-spec

databases:
  - name: najahni-db
    plan: free
    databaseName: najahni_db
    user: najahni

services:
  - type: web
    name: najahni-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: najahni-db
          property: connectionString
      - key: MESSENGER_TRANSPORT_DSN
        value: doctrine://default?auto_setup=0
      - key: DEFAULT_URI
        value: https://najahni-web.onrender.com
      - key: APP_PUBLIC_URL
        value: https://najahni-web.onrender.com
      # ── Set these manually in the Render dashboard ──
      - key: MAILER_DSN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RECAPTCHA3_KEY
        sync: false
      - key: RECAPTCHA3_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: HF_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
